# The default N-body run: the dataset, the graph network trained on it and the suite
# both are scored by. One file is the whole run, and its hash is the run identifier.
name: nbody
seed: 0
output_dir: runs

system:
  name: nbody
  parameters:
    gravitational_constant: 1.0
    softening: 0.01

data:
  root: data
  n_trajectories: 64
  n_steps: 256
  # A stored step of 0.01 over 256 states covers 2.55 time units, which is several
  # crossing times for a cluster of unit radius and unit total mass.
  dt: 0.01
  # Velocity Verlet stays accurate at a fiftieth of the shortest orbital period. Close
  # encounters in the collapsing cloud set that period, and softening bounds it below,
  # so the solver takes ten steps for every one that is stored.
  substeps: 10
  # Both trainable regimes carry 32 bodies, so a batch drawn from any of the training,
  # validation or test splits can be stacked.
  regimes: [cold_collapse, virialised_cluster]
  # Four bodies in two tight binaries: a configuration class the model never sees, with
  # two separated timescales rather than one.
  held_out_regimes: [hierarchical_pair]
  val_fraction: 0.15
  test_fraction: 0.15
  workers: null
  shard_trajectories: 16
  compression_level: 4

model:
  name: graph
  hyperparameters:
    # Thirty two bodies fully connected is a thousand edges per state, so the width is
    # what sets the cost. Two rounds let a body feel the field of a body it is not
    # directly reading, which is what many body means here.
    hidden: 64
    rounds: 2

training:
  epochs: 40
  batch_size: 32
  learning_rate: 0.002
  weight_decay: 0.0
  warmup_epochs: 2
  final_learning_rate_fraction: 0.02
  gradient_clip: 1.0
  # Eight epochs without an improvement in the validation rollout. Long enough to survive
  # the jump in the metric that each curriculum stage causes.
  patience: 8
  min_improvement: 0.0
  # One step, then four, then eight. The lengthening is what makes the model stable over
  # a long rollout, and it costs proportionally, so it starts late and ends short. It
  # also starts after the learning rate has come well off its peak, because a stage
  # change is the one moment in a run when the loss jumps.
  curriculum: [1, 4, 8]
  curriculum_epochs: [0, 18, 30]
  # Fixed at sixteen whatever the curriculum is doing, so early stopping compares one
  # epoch's number against another's rather than against a different question.
  validation_steps: 16
  # Below one, so that learning to stay on the rails over a window never costs more
  # accuracy on the single step than it buys.
  multi_step_weight: 0.5
  physics_weight: 0.0
  # Every eighth window rather than every one. Consecutive windows of a trajectory differ
  # by one state out of hundreds, so the eight that are dropped teach almost nothing and
  # cost an epoch eight times over.
  window_stride: 8
  loader_workers: 0

# Four models of this configuration, differing only in initialisation and shuffling.
# Their disagreement is the uncertainty estimate.
ensemble:
  members: 4

evaluation:
  name: standard
  metrics:
    - one_step_error
    - rollout_error
    - invariant_drift
    - symmetry_violation
    - distribution_drift
    - calibration
  # Ground truth first, then every fixture that is wrong on purpose. The broken ones stay
  # in the default suite because a metric's numbers only mean something next to theirs.
  # The last two state an uncertainty, one honestly and one a hundred times too small,
  # and the calibration metric means nothing without both.
  predictors:
    - reference
    - persistence
    - linear_extrapolation
    - noise
    - energy_injection
    - symmetry_break
    - calibrated
    - overconfident
  rollout_steps: 255
  n_initial_conditions: 4
  error_thresholds: [0.01, 0.1, 1.0]
  # Three declared symmetries, so each initial condition costs three extra rollouts. A
  # thirty two step horizon keeps that affordable, and a violation that is not visible by
  # then is not the kind this catches.
  symmetry_steps: 32
  distribution_window: 0.25
  divergence_factor: 1000.0
  # A tenth of the signal: the middle declared threshold, and the level a predictor's own
  # uncertainty is asked to warn about before the error reaches it.
  trust_threshold: 0.1
